<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارزون‌‌جو | موتور هوشمند جستجوی ارزان‌ترین کالا</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>ارزون‌جو 🚀</h1>
        <p>موتور هوشمند و فوق‌پیشرفته مقایسه قیمت بازار</p>
    </header>

    <main class="container">
        <div class="search-box">
            <input type="text" id="queryInput" placeholder="محصول دلخواهت رو سرچ کن (مثلا گوشی سامسونگ)..." onkeypress="if(event.key === 'Enter') searchProducts()">
            <button onclick="searchProducts()"><i class="fa-solid fa-magnifying-glass"></i> جستجو</button>
        </div>

        <div id="resultsContainer" class="products-grid">
            <p class="guide-text">💡 لطفاً نام کالای مورد نظر خود را برای جستجو در دیجی‌کالا وارد کنید.</p>
        </div>
    </main>

    <script>
        async function searchProducts() {
            const query = document.getElementById('queryInput').value.trim();
            const container = document.getElementById('resultsContainer');
            
            if (!query) {
                alert('لطفاً عبارتی را برای جستجو وارد کنید.');
                return;
            }

            container.innerHTML = '<p class="loading"><i class="fa-solid fa-spinner"></i> در حال کاوش و جستجوی هوشمند در بازار...</p>';

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();
                
                if (data.status === 'success') {
                    container.innerHTML = '';
                    if (data.results.length === 0) {
                        container.innerHTML = '<p class="guide-text">محصولی با این مشخصات یافت نشد.</p>';
                        return;
                    }

                    data.results.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <div class="product-img-wrapper">
                                <img src="${item.image}" alt="${item.title}" class="product-img">
                            </div>
                            <h3>${item.title}</h3>
                            <div class="product-info">
                                <span class="store">${item.store}</span>
                                <span class="price">${item.price}</span>
                            </div>
                            <a href="${item.link}" target="_blank" class="btn-buy">
                                <i class="fa-solid fa-cart-shopping"></i> مشاهده و خرید
                            </a>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<p class="guide-text">خطا: ${data.message}</p>`;
                }
            } catch (error) {
                container.innerHTML = '<p class="guide-text">خطا در برقراری ارتباط با سرور.</p>';
                console.error(error);
            }
        }
    </script>
</body>
</html>
