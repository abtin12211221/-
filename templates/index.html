<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ارزون‌جو موتور هوشمند جستجوی ارزان‌ترین قیمت کالاهای بازار ایران.">
    <title>ارزون‌جو | موتور هوشمند جستجوی ارزان‌ترین کالا</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>ارزون‌جو 🚀</h1>
        <p>موتور هوشمند مقایسه قیمت</p>
    </header>

    <main class="container">
        <!-- بخش جستجو -->
        <div class="search-box">
            <input type="text" id="queryInput" placeholder="نام کالا را وارد کنید (مثلا گوشی سامسونگ)...">
            <button onclick="searchProducts()">جستجو</button>
        </div>

        <!-- بخش نمایش نتایج -->
        <div id="resultsContainer" class="products-grid">
            <p class="guide-text">لطفاً نام کالای مورد نظر خود را جستجو کنید.</p>
        </div>
    </main>

    <script>
        async function searchProducts() {
            const query = document.getElementById('queryInput').value.trim();
            const container = document.getElementById('resultsContainer');
            
            if (!query) {
                alert('لطفاً عبارتی را برای جستجو وارد کنید.');
                return;
            }

            container.innerHTML = '<p class="loading">در حال جستجو در بازار...</p>';

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();
                
                if (data.status === 'success') {
                    container.innerHTML = '';
                    if (data.results.length === 0) {
                        container.innerHTML = '<p>محصولی یافت نشد.</p>';
                        return;
                    }

                    data.results.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <img src="${item.image}" alt="${item.title}" class="product-img">
                            <h3>${item.title}</h3>
                            <p class="store">فروشگاه: <span>${item.store}</span></p>
                            <p class="price">وضعیت: <span>${item.price}</span></p>
                            <a href="${item.link}" target="_blank" class="btn-buy">مشاهده و خرید (افیلیو)</a>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<p>خطا: ${data.message}</p>`;
                }
            } catch (error) {
                container.innerHTML = '<p>خطا در برقراری ارتباط با سرور.</p>';
                console.error(error);
            }
        }
    </script>
</body>
</html>
