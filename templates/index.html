<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارزون جو | موتور هوشمند مقایسه قیمت</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div class="cyber-bg"></div>

    <div class="container">
        <header class="header">
            <div class="logo-container">
                <svg class="rocket-icon" viewBox="0 0 24 24" width="36" height="36" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 3 0 3 0z"></path><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-3 0-3z"></path></svg>
                <h1>ارزون‌جو</h1>
            </div>
            <p class="subtitle">موتور هوشمند و فوق‌العاده پیشرفته مقایسه قیمت بازار</p>
        </header>

        <div class="search-box">
            <input type="text" id="queryInput" placeholder="نام محصول مورد نظر را وارد کنید (مثلا: گوشی سامسونگ)..." autocomplete="off">
            <button id="searchBtn" onclick="performSearch()">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                جستجو
            </button>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>در حال جستجو و استخراج بهترین قیمت‌ها...</p>
        </div>

        <div id="resultsContainer" class="results-grid"></div>
    </div>

    <script>
        async function performSearch() {
            const query = document.getElementById('queryInput').value.trim();
            const loading = document.getElementById('loading');
            const container = document.getElementById('resultsContainer');

            if (!query) {
                alert('لطفاً نام محصول را وارد کنید.');
                return;
            }

            loading.classList.remove('hidden');
            container.innerHTML = '';

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();
                loading.classList.add('hidden');

                if (data.status === 'success' && data.results.length > 0) {
                    data.results.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <div class="img-container">
                                <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/200'">
                                <span class="store-badge">${item.store}</span>
                            </div>
                            <div class="product-info">
                                <h3>${item.title}</h3>
                                <div class="price-action">
                                    <span class="price">${item.price}</span>
                                    <a href="${item.link}" target="_blank" class="buy-btn">مشاهده و خرید</a>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<p class="no-result">محصولی با این مشخصات یافت نشد.</p>';
                }
            } catch (error) {
                loading.classList.add('hidden');
                container.innerHTML = '<p class="no-result">خطا در برقراری ارتباط با سرور.</p>';
            }
        }

        // جستجو با زدن دکمه Enter روی کیبورد
        document.getElementById('queryInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
    </script>
</body>
</html>
