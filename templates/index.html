<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارزون‌جو | موتور هوشمند مقایسه قیمت بازار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <!-- هدر سایت -->
    <header class="w-full max-w-4xl text-center my-8">
        <h1 class="text-4xl font-extrabold text-purple-400 mb-2">🚀 ارزون‌جو</h1>
        <p class="text-slate-400 text-sm">موتور هوشمند و فوق‌العاده پیشرفته مقایسه قیمت بازار</p>
    </header>

    <!-- بخش جستجو -->
    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-2xl flex items-center gap-3">
        <input type="text" id="queryInput" placeholder="نام محصول مورد نظر را وارد کنید (مثلاً: گوشی سامسونگ)..." 
               class="flex-1 bg-slate-950 border border-slate-800 text-slate-200 px-4 py-3 rounded-xl focus:outline-none focus:border-purple-500 transition">
        <button onclick="performSearch()" id="searchBtn" 
                class="bg-purple-600 hover:bg-purple-500 text-white px-6 py-3 rounded-xl font-medium transition flex items-center gap-2">
            🔍 جستجو
        </button>
    </div>

    <!-- وضعیت لودینگ -->
    <div id="loading" class="hidden my-8 text-purple-400 text-sm animate-pulse">
        در حال جستجو و استخراج بهترین قیمت‌ها...
    </div>

    <!-- نتایج جستجو -->
    <div id="resultsContainer" class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-4 mt-8"></div>

    <script>
        async function performSearch() {
            const query = document.getElementById('queryInput').value.trim();
            const container = document.getElementById('resultsContainer');
            const loading = document.getElementById('loading');
            
            if (!query) {
                alert('لطفاً نام محصول را وارد کنید.');
                return;
            }

            container.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();
                loading.classList.add('hidden');

                if (data.status === 'success' && data.results.length > 0) {
                    data.results.forEach(item => {
                        const card = document.createElement('div');
                        card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between hover:border-purple-500/50 transition shadow-lg";
                        
                        card.innerHTML = `
                            <div>
                                <div class="flex items-center justify-between mb-3">
                                    <span class="text-xs bg-purple-950 text-purple-300 px-3 py-1 rounded-full font-medium border border-purple-800/50">${item.store}</span>
                                    <span class="text-xs text-slate-400 font-semibold">${item.price}</span>
                                </div>
                                <h3 class="text-base font-bold text-slate-200 mb-4">${item.title}</h3>
                            </div>
                            <div class="flex items-center justify-between mt-4 pt-3 border-t border-slate-800">
                                <div class="flex items-center gap-2">
                                    <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-xs font-bold text-purple-400">🛍️</div>
                                    <span class="text-xs text-slate-400">خرید مستقیم</span>
                                </div>
                                <a href="${item.link}" target="_blank" 
                                   class="bg-purple-600 hover:bg-purple-500 text-white text-xs px-4 py-2 rounded-xl font-medium transition shadow-md">
                                   مشاهده و خرید
                                </a>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<p class="text-center text-slate-500 col-span-2">محصولی یافت نشد.</p>';
                }
            } catch (error) {
                loading.classList.add('hidden');
                alert('خطا در ارتباط با سرور رخ داد.');
            }
        }

        // جستجو با زدن کلید Enter روی کیبورد
        document.getElementById('queryInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
    </script>
</body>
</html>
