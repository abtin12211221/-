<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارزون‌جو | موتور هوشمند مقایسه قیمت بازار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect:hover {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.2);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-purple-600 selection:text-white">

    <!-- هدر و بخش بالایی -->
    <header class="w-full max-w-5xl mx-auto px-4 pt-12 pb-6 text-center">
        <div class="inline-flex items-center gap-2 bg-purple-500/10 border border-purple-500/20 px-4 py-1.5 rounded-full text-purple-400 text-xs font-semibold mb-4 shadow-sm">
            ✨ نسل جدید سامانه جامع مقایسه قیمت و خرید هوشمند
        </div>
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight text-white mb-4">
            ارزون<span class="text-purple-500">جو</span>
        </h1>
        <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">
            نام محصول مورد نظر خود را بنویسید تا بهترین و معتبرترین بازارها را برایتان زیرورو کنیم.
        </p>

        <!-- کادر جستجو -->
        <div class="mt-8 max-w-2xl mx-auto glass-panel p-2.5 rounded-2xl shadow-2xl flex items-center gap-3 transition focus-within:border-purple-500">
            <span class="text-xl px-2 text-purple-400">🔍</span>
            <input type="text" id="queryInput" placeholder="جستجوی گوشی، لپ‌تاپ، لوازم خانگی..." 
                   class="flex-1 bg-transparent border-none text-slate-100 placeholder-slate-500 px-2 py-3 focus:outline-none text-sm md:text-base">
            <button onclick="performSearch()" id="searchBtn" 
                    class="bg-purple-600 hover:bg-purple-500 text-white px-6 py-3.5 rounded-xl font-medium transition shadow-lg shadow-purple-600/30 text-sm md:text-base flex items-center gap-2">
                جستجو کن
            </button>
        </div>
    </header>

    <!-- لودینگ جذاب -->
    <div id="loading" class="hidden my-16 flex flex-col items-center gap-3">
        <div class="w-12 h-12 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-purple-400 text-sm font-medium animate-pulse">در حال استعلام قیمت و آماده‌سازی نتایج بازار...</p>
    </div>

    <!-- نتایج جستجو -->
    <main class="w-full max-w-5xl mx-auto px-4 my-8 flex-1">
        <div id="resultsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- فوتر -->
    <footer class="w-full text-center py-6 text-slate-600 text-xs border-t border-slate-900/80 mt-auto">
        قدرت گرفته از موتور جستجوی هوشمند ارزون‌جو © 2026
    </footer>

    <script>
        async function performSearch() {
            const query = document.getElementById('queryInput').value.trim();
            const container = document.getElementById('resultsContainer');
            const loading = document.getElementById('loading');
            
            if (!query) {
                alert('لطفاً نام محصول را وارد کنید.');
                return;
            }

            container.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();
                loading.classList.add('hidden');

                if (data.status === 'success' && data.results.length > 0) {
                    data.results.forEach(item => {
                        const card = document.createElement('div');
                        card.className = "glass-panel rounded-2xl p-5 flex flex-col justify-between glow-effect transition-all duration-300 hover:-translate-y-1 shadow-xl";
                        
                        card.innerHTML = `
                            <div>
                                <div class="flex items-center justify-between mb-4">
                                    <span class="text-xs px-3 py-1 rounded-full font-semibold border ${item.badge_color}">
                                        ${item.logo} ${item.store}
                                    </span>
                                    <span class="text-xs text-slate-500 font-medium">${item.category}</span>
                                </div>
                                <h3 class="text-base font-bold text-slate-200 mb-4 leading-relaxed">${item.title}</h3>
                            </div>
                            <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between gap-3">
                                <div class="text-xs text-purple-400 font-medium flex items-center gap-1">
                                    <span>⚡</span> ${item.price_text}
                                </div>
                                <a href="${item.link}" target="_blank" 
                                   class="bg-purple-600 hover:bg-purple-500 text-white text-xs px-4 py-2.5 rounded-xl font-medium transition shadow-md shadow-purple-600/20 whitespace-nowrap">
                                   مشاهده و خرید
                                </a>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<p class="text-center text-slate-500 col-span-3 py-10">محصولی یافت نشد.</p>';
                }
            } catch (error) {
                loading.classList.add('hidden');
                alert('خطا در برقراری ارتباط با سرور رخ داد.');
            }
        }

        // جستجو با زدن کلید Enter
        document.getElementById('queryInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
    </script>
</body>
</html>
